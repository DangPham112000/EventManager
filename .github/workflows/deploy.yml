name: Deploy to VPS

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - '.agents/**'
      - '.vscode/**'
      - '.gitignore'
      - 'LICENSE'
  workflow_dispatch:

# GitHub keeps a single secret, DOPPLER_TOKEN (read-only service token for event-manager/prd).
# Everything else comes from Doppler. GHCR uses the job's own GITHUB_TOKEN, which expires when
# the job ends, so there is no personal access token.
permissions:
  contents: read
  packages: write

jobs:
  build-backend:
    name: Build & Push Backend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: backend-${{ github.ref }}
      cancel-in-progress: true

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Backend
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/backend
          tags: |
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Backend Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./backend/Dockerfile
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-frontend:
    name: Build & Push Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: frontend-${{ github.ref }}
      cancel-in-progress: true

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # The publishable key lives in Doppler (project event-manager, config prd).
      # `doppler secrets get` fails the job if the token or the key is missing,
      # so a build without sign-in never ships.
      - name: Install Doppler CLI
        uses: dopplerhq/cli-action@v3

      - name: Load build-time keys from Doppler
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        run: |
          if [ -z "$DOPPLER_TOKEN" ]; then
            echo "::error::Set the DOPPLER_TOKEN repository secret (a read-only service token for event-manager/prd)."
            exit 1
          fi
          # The backend uses the same publishable key, so Doppler keeps one variable
          # (a reference to the shared Clerk app) and the frontend build gets it under
          # its VITE_ name. A VITE_ copy in Doppler would be a chained reference, which
          # Doppler does not allow.
          KEY=$(doppler secrets get CLERK_PUBLISHABLE_KEY --plain)
          echo "VITE_CLERK_PUBLISHABLE_KEY=$KEY" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Frontend
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/frontend
          tags: |
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Frontend Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./frontend/Dockerfile
          push: true
          # The publishable key is public; Vite inlines it into the bundle.
          build-args: |
            VITE_CLERK_PUBLISHABLE_KEY=${{ env.VITE_CLERK_PUBLISHABLE_KEY }}
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to VPS
    needs: [build-backend, build-frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: vps-deploy-${{ github.ref }}
      cancel-in-progress: false

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Doppler CLI
        uses: dopplerhq/cli-action@v3

      # VPS_HOST, VPS_USERNAME and VPS_SSH_KEY live in Doppler (references to shared/prd, the same
      # for every app), so GitHub keeps only DOPPLER_TOKEN. They are masked in the logs.
      - name: Load deploy secrets from Doppler
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        run: |
          for name in VPS_HOST VPS_USERNAME VPS_SSH_KEY; do
            value=$(doppler secrets get "$name" --plain)
            if [ -z "$value" ]; then
              echo "::error::$name is empty in Doppler event-manager/prd."
              exit 1
            fi
            while IFS= read -r line; do
              if [ -n "$line" ]; then echo "::add-mask::$line"; fi
            done <<< "$value"
            { echo "$name<<__DOPPLER_EOF__"; echo "$value"; echo "__DOPPLER_EOF__"; } >> "$GITHUB_ENV"
          done

      - name: Copy docker-compose and nginx config to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ env.VPS_HOST }}
          username: ${{ env.VPS_USERNAME }}
          key: ${{ env.VPS_SSH_KEY }}
          source: "docker-compose.yml,nginx/,scripts/migrate-to-shared-mongo.sh,scripts/backup-db.sh"
          target: "/opt/event-manager"

      - name: Deploy and Restart Services on VPS
        uses: appleboy/ssh-action@v1.0.3
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        with:
          host: ${{ env.VPS_HOST }}
          username: ${{ env.VPS_USERNAME }}
          key: ${{ env.VPS_SSH_KEY }}
          envs: GITHUB_REPOSITORY
          script: |
            set -e
            cd /opt/event-manager

            # Image names on GHCR must be lowercase (repo is DangPham112000/EventManager)
            export IMAGE_PREFIX=$(echo "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')

            # Keep registry credentials in this project only, so the login does not
            # overwrite the docker config other stacks on the VPS rely on.
            export DOCKER_CONFIG=/opt/event-manager/.docker
            mkdir -p "$DOCKER_CONFIG"
            # The job's GITHUB_TOKEN can read this repo's packages until the job ends.
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # Runtime secrets come from Doppler. The VPS deploy user has a read-only
            # service token scoped to /opt/event-manager (doppler configure set token
            # --scope /opt/event-manager). Stop here if it is missing, rather than
            # starting a backend without its Clerk keys.
            if ! doppler secrets get CLERK_SECRET_KEY --plain > /dev/null; then
              echo "Doppler is not set up for /opt/event-manager on this VPS user." >&2
              exit 1
            fi

            # The backend uses the shared MongoDB (ecosystem-infra, DAN-90). Stop before changing
            # anything if that stack or this app's Mongo password is missing.
            if ! docker network inspect ecosystem > /dev/null 2>&1; then
              echo "Network 'ecosystem' is missing: deploy the shared Mongo stack (ecosystem-infra) first." >&2
              exit 1
            fi
            if [ -z "$(doppler secrets get MONGO_PASSWORD --plain)" ]; then
              echo "MONGO_PASSWORD is missing in Doppler event-manager/prd." >&2
              exit 1
            fi

            # Pull new images. Compose needs MONGO_PASSWORD even to read the file, so every
            # compose call runs under Doppler.
            doppler run -- docker compose pull

            # One-time copy of the event-manager database from the stack's old Mongo container
            # to the shared instance, with a dump kept in backups/. No-op once the old container
            # is gone; on failure it restarts the old backend and the deploy stops here.
            doppler run -- bash scripts/migrate-to-shared-mongo.sh

            # One-time dump before the backend that moves user references to Clerk ids (DAN-92).
            doppler run -- bash scripts/backup-db.sh pre-dan-92

            # Restart services with the secrets from Doppler in the environment,
            # where docker compose fills in ${CLERK_SECRET_KEY} and the rest.
            # --remove-orphans removes the old Mongo container; its volume stays until deleted by hand.
            doppler run -- docker compose up -d --remove-orphans

            # Prune dangling unused images (preserves layer cache for fast future pulls)
            docker image prune -f
