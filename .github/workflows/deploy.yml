name: Deploy to VPS

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - '.agents/**'
      - '.vscode/**'
      - '.gitignore'
      - 'LICENSE'
  workflow_dispatch:

jobs:
  build-backend:
    name: Build & Push Backend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: backend-${{ github.ref }}
      cancel-in-progress: true

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GH_PAT }}

      - name: Extract metadata for Backend
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/backend
          tags: |
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Backend Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./backend/Dockerfile
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-frontend:
    name: Build & Push Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: frontend-${{ github.ref }}
      cancel-in-progress: true

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Without the key the build succeeds but the app has no sign-in, and
      # every request fails against a backend that requires one.
      - name: Check Clerk publishable key
        env:
          KEY: ${{ vars.CLERK_PUBLISHABLE_KEY || secrets.CLERK_PUBLISHABLE_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::error::Set the CLERK_PUBLISHABLE_KEY repository variable (Settings → Secrets and variables → Actions → Variables)."
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GH_PAT }}

      - name: Extract metadata for Frontend
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/frontend
          tags: |
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Frontend Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./frontend/Dockerfile
          push: true
          # The publishable key is public; Vite inlines it into the bundle.
          build-args: |
            VITE_CLERK_PUBLISHABLE_KEY=${{ vars.CLERK_PUBLISHABLE_KEY || secrets.CLERK_PUBLISHABLE_KEY }}
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to VPS
    needs: [build-backend, build-frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: vps-deploy-${{ github.ref }}
      cancel-in-progress: false

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Copy docker-compose and nginx config to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          # These secrets are configured in GitHub repo Settings → Secrets.
          # The linter cannot verify them statically, so we suppress the warnings.
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "docker-compose.yml,nginx/"
          target: "/opt/event-manager"

      - name: Check Clerk secret key
        env:
          KEY: ${{ secrets.CLERK_SECRET_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::error::Set the CLERK_SECRET_KEY repository secret (Settings → Secrets and variables → Actions → Secrets)."
            exit 1
          fi

      - name: Deploy and Restart Services on VPS
        uses: appleboy/ssh-action@v1.0.3
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
        with:
          # These secrets are configured in GitHub repo Settings → Secrets.
          # The linter cannot verify them statically, so we suppress the warnings.
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: GITHUB_REPOSITORY,CLERK_SECRET_KEY
          script: |
            set -e
            cd /opt/event-manager

            # Image names on GHCR must be lowercase (repo is DangPham112000/EventManager)
            export IMAGE_PREFIX=$(echo "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')

            # Keep registry credentials in this project only, so the login does not
            # overwrite the docker config other stacks on the VPS rely on.
            export DOCKER_CONFIG=/opt/event-manager/.docker
            mkdir -p "$DOCKER_CONFIG"
            echo "${{ secrets.GH_PAT }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # Pull new images
            docker compose pull

            # Restart services
            docker compose up -d --remove-orphans

            # Prune dangling unused images (preserves layer cache for fast future pulls)
            docker image prune -f
